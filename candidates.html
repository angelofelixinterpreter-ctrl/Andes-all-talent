<form class="form-card"
      action="https://formspree.io/f/xyekgqjr"
      method="POST"
      enctype="multipart/form-data">

  <div class="form-grid">

    <div class="field">
      <label>First Name *</label>
      <input type="text" name="first_name" required>
    </div>

    <div class="field">
      <label>Last Name *</label>
      <input type="text" name="last_name" required>
    </div>

    <div class="field">
      <label>Email *</label>
      <input type="email" name="email" required>
    </div>

    <div class="field">
      <label>Phone / WhatsApp</label>
      <input type="tel" name="phone">
    </div>

    <div class="field">
      <label>Country *</label>
      <input type="text" name="country" required>
    </div>

    <div class="field">
      <label>Current Position</label>
      <input type="text" name="current_position">
    </div>

    <div class="field">
      <label>Industry</label>
      <select name="industry">
        <option value="">Select industry</option>
        <option value="Legal & Compliance">Legal & Compliance</option>
        <option value="Technology & IT">Technology & IT</option>
        <option value="Finance & Accounting">Finance & Accounting</option>
        <option value="Customer Support">Customer Support</option>
        <option value="Marketing & Creative">Marketing & Creative</option>
        <option value="Human Resources">Human Resources</option>
        <option value="Administrative & Operations">Administrative & Operations</option>
        <option value="Sales & Business Development">Sales & Business Development</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="field">
      <label>Years of Experience</label>
      <input type="number" name="years_of_experience" min="0">
    </div>

    <div class="field">
      <label>English Level</label>
      <select name="english_level">
        <option value="">Select level</option>
        <option value="Basic">Basic</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Upper Intermediate">Upper Intermediate</option>
        <option value="Advanced">Advanced</option>
        <option value="Fluent">Fluent</option>
      </select>
    </div>

    <div class="field">
      <label>LinkedIn Profile</label>
      <input
        type="url"
        name="linkedin"
        placeholder="https://linkedin.com/in/...">
    </div>

    <div class="field full">
      <label>Key Skills</label>
      <textarea name="key_skills"></textarea>
    </div>

    <div class="field full">
      <label>CV</label>
      <input
        type="file"
        name="cv"
        accept=".pdf,.doc,.docx">
    </div>

    <div class="field full">
      <label class="check">
        <input
          type="checkbox"
          name="contact_consent"
          value="Yes"
          required>
        I agree to be contacted regarding professional opportunities. *
      </label>
    </div>

    <div class="field full">
      <button class="btn btn-primary" type="submit">
        Join the Talent Network →
      </button>
    </div>

  </div>
</form>
